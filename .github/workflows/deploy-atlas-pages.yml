name: Deploy Homology Atlas

on:
  push:
    branches:
      - main
    paths:
      - dist/atlas.html
      - scripts/build_static_bundle.py
      - .github/workflows/deploy-atlas-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Publishing an unreviewed feedback preview still requires the explicit gate below.
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Enforce the stable-spectrum review gate
        run: |
          if test -f docs/reviews/steenrod-cw49-v1-dan.json; then
            python3 scripts/verify_steenrod_release.py \
              --atlas dist/atlas.html \
              --review docs/reviews/steenrod-cw49-v1-dan.json \
              --verify-rebuild
          else
            python3 scripts/verify_steenrod_release.py \
              --atlas dist/atlas.html \
              --allow-public-review-preview \
              --verify-rebuild
          fi

      - name: Prepare the static site
        run: |
          python3 scripts/build_static_bundle.py \
            --atlas dist/atlas.html \
            --output _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload the atlas
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
