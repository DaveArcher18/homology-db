name: Test pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Prove complete deterministic partition
        run: python3 scripts/run_unittest_shard.py --shard-count 4 --verify-partition

  test-shard:
    needs: suite-plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run regression shard ${{ matrix.shard }}
        run: python3 scripts/run_unittest_shard.py --shard-count 4 --shard-index ${{ matrix.shard }}

  release-build:
    needs: suite-plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify deterministic release rebuild
        run: |
          python3 scripts/verify_steenrod_release.py \
            --atlas dist/atlas.html \
            --allow-public-review-preview \
            --verify-rebuild

  test:
    if: ${{ always() }}
    needs: [suite-plan, test-shard, release-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the complete suite and release build
        env:
          SUITE_PLAN_RESULT: ${{ needs.suite-plan.result }}
          TEST_SHARD_RESULT: ${{ needs.test-shard.result }}
          RELEASE_BUILD_RESULT: ${{ needs.release-build.result }}
        run: |
          test "$SUITE_PLAN_RESULT" = success
          test "$TEST_SHARD_RESULT" = success
          test "$RELEASE_BUILD_RESULT" = success
