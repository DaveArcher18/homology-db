name: Mathematical family review
description: Review the exact formulas, products and coverage of a versioned family rule.
title: "[Family review] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reviewing! Your GitHub account identifies the submitter.
        This form does not automatically mark mathematics as reviewed. A maintainer
        checks authorship, scope and the exact rule hash before publishing your verdict.
        You can review one instance, a parameter range, selected coefficients,
        degrees or theories. Narrow acceptance never approves the entire rule.
  - type: input
    id: rule-id
    attributes:
      label: Rule ID
    validations:
      required: true
  - type: input
    id: rule-version
    attributes:
      label: Rule version
    validations:
      required: true
  - type: input
    id: rule-hash
    attributes:
      label: Rule content SHA-256
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Exact review scope
      description: Preserve or narrow the prefilled scope JSON. State n or its inclusive range, coefficients, degrees and components (homology, cohomology, multiplication). Use entire_rule only after reviewing the whole sourced rule.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Sources and rule link
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: Mathematical verdict
      options:
        - accept
        - needs-evidence
        - reject
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Review reasoning
      description: Explain what you checked within the declared scope, including any relevant boundary cases, torsion or products. List limitations and corrections; do not imply checks outside that scope.
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Review confirmation
      options:
        - label: This is my human mathematical review of the identified rule, not an automated check or a report of another person's approval.
          required: true
